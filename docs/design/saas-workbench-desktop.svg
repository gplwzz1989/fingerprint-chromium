<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title description">
  <title id="title">指纹云控桌面账号工作台高保真设计稿</title>
  <desc id="description">shadcn 风格桌面设计，展示尚未选择工作区的初始状态，不含虚构账号或业务指标。</desc>
  <defs>
    <style>
      text{font-family:"Geist","Noto Sans SC","Microsoft YaHei",sans-serif;fill:#18181b;font-size:14px} .muted{fill:#71717a}.small{font-size:12px}.label{font-size:13px;font-weight:600}.heading{font-size:24px;font-weight:650}.section-title{font-size:18px;font-weight:600}.metric-value{font-size:26px;font-weight:600}.white{fill:#fff}.line{stroke:#e4e4e7;stroke-width:1}.icon{stroke:#52525b;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
