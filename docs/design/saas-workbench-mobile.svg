<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title description">
  <title id="title">指纹云控安卓账号工作台高保真设计稿</title>
  <desc id="description">移动端 shadcn 风格设计，初始工作区未选择，状态待读取，无虚构账号数据。</desc>
  <defs><style>text{font-family:"Geist","Noto Sans SC","Microsoft YaHei",sans-serif;fill:#18181b;font-size:14px}.muted{fill:#71717a}.small{font-size:12px}.label{font-weight:600}.heading{font-size:23px;font-weight:650}.section-title{font-size:18px;font-weight:600}.icon{stroke:#52525b;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.line{stroke:#e4e4e7}.white{fill:#fff}</style></defs>
  <rect width="390" height="844" fill="#fff"/>
  <rect width="390" height="44" fill="#fafafa"/><text x="20" y="28" class="muted small">安卓页面设计 · 初始空状态</text>
  <rect x="16" y="60" width="30" height="30" rx="7" fill="#18181b"/><path d="M24 83V72m7 11V66m7 17v-8" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/>
  <text x="57" y="81" class="label">指纹云控</text>
  <circle cx="354" cy="75" r="16" fill="#fafafa" stroke="#e4e4e7"/><circle cx="354" cy="71" r="4" class="icon"/><path d="M347 81c0-8 14-8 14 0" class="icon"/>
  <path d="M0 105h390" class="line"/>
  <rect x="16" y="121" width="358" height="44" rx="7" fill="#fafafa" stroke="#e4e4e7"/><text x="31" y="149" class="label">选择工作区</text><path d="m344 141 5 5 5-5" class="icon"/>
  <text x="16" y="210" class="heading">账号环境</text><text x="16" y="236" class="muted small">管理独立环境，在本机打开并跨设备同步。</text>
  <rect x="16" y="255" width="358" height="44" rx="6" fill="#fff" stroke="#e4e4e7"/><circle cx="35" cy="274" r="6" class="icon"/><path d="m39 278 5 5" class="icon"/><text x="56" y="282" class="muted small">搜索账号名称、标识或标签</text>
  <rect x="16" y="315" width="358" height="297" rx="9" fill="#fff" stroke="#e4e4e7"/>
  <rect x="173" y="345" width="44" height="44" rx="10" fill="#fafafa" stroke="#e4e4e7"/><path d="M184 357h22v20h-22zM184 362h22" class="icon"/>
  <text x="195" y="425" text-anchor="middle" class="section-title">先选择一个工作区</text>
  <text x="195" y="453" text-anchor="middle" class="muted small">账号和团队权限将在工作区内管理。</text>
  <rect x="38" y="480" width="314" height="44" rx="6" fill="#18181b"/><text x="195" y="508" text-anchor="middle" class="white label">创建工作区</text>
  <rect x="38" y="536" width="314" height="44" rx="6" fill="#fff" stroke="#e4e4e7"/><text x="195" y="564" text-anchor="middle" class="label">使用邀请令牌加入团队</text>
  <rect x="16" y="632" width="358" height="80" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="31" y="658" class="label">环境同步</text><text x="31" y="681" class="muted small">选择数据类别，安全共享账号环境。</text><path d="m350 665 5 5-5 5" class="icon"/>
  <circle cx="21" cy="737" r="3" fill="#a1a1aa"/><text x="31" y="742" class="muted small">本机浏览器待连接</text>
  <rect y="766" width="390" height="78" fill="#fafafa"/><path d="M0 766h390" class="line"/>
  <rect x="21" y="776" width="62" height="52" rx="7" fill="#eaeaec"/>
  <rect x="44" y="784" width="16" height="13" rx="2" class="icon"/><text x="52" y="818" text-anchor="middle" class="small label">账号</text>
  <path d="M139 784a7 7 0 0 1 12 3m0 0v-4m0 4h-4m-10 5a7 7 0 0 0 12 3" class="icon"/><text x="145" y="818" text-anchor="middle" class="muted small">同步</text>
  <circle cx="239" cy="788" r="4" class="icon"/><path d="M232 800c0-8 14-8 14 0" class="icon"/><text x="239" y="818" text-anchor="middle" class="muted small">团队</text>
  <path d="m324 786 8-3 8 3v7c0 5-8 8-8 8s-8-3-8-8z" class="icon"/><text x="332" y="818" text-anchor="middle" class="muted small">安全</text>
</svg>
